name: Deploy OffSay Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://offsay.in
          NEXT_PUBLIC_PORTAL_URL: https://merchant.offsay.in
          NEXT_PUBLIC_API_BASE_URL: https://api.offsay.in
          NEXT_PUBLIC_CONTACT_EMAIL: offsay.official@gmail.com
          # Firebase web client configuration is public by design. Authentication
          # security is enforced by Firebase rules and Django token verification.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDnQkBzs4TrTQqgBQT6Xt1xcNFJqx8s51g
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: offsay-e1006.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: offsay-e1006
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:117499389887:web:f6df5550c83789ea35e30a

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
